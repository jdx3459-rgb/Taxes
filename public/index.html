<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夜航 · 私人牌局</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/game-controls.css" />
  </head>
  <body>
    <main id="app">
      <section id="gate" class="gate">
        <div class="brand">NIGHT <i>FLIGHT</i><span>私人牌局</span></div>
        <div class="gate-card">
          <p class="eyebrow">WELCOME TO THE TABLE</p>
          <h1>今夜，来一手？</h1>
          <p class="intro">这是一个只属于朋友的小牌桌。输入主人分享的密码，选个昵称就能入座或静静观战。</p>
          <form id="entry-form">
            <label>你的昵称<input id="name" maxlength="16" placeholder="例如：阿哲" autocomplete="nickname" required /></label>
            <label>房间密码<input id="password" type="password" placeholder="向牌局主人获取" required /></label>
            <div class="mode-picker"><button type="button" class="mode active" data-mode="player">我要入座</button><button type="button" class="mode" data-mode="watcher">我来观战</button></div>
            <p id="entry-error" class="error"></p>
            <button class="enter" type="submit">进入牌局 <span>→</span></button>
          </form>
        </div>
        <p class="footnote">仅供休闲娱乐 · 无真实货币</p>
      </section>
      <section id="table-view" class="hidden">
        <header><div class="mini-brand">NIGHT <i>FLIGHT</i></div><div id="room-status" class="room-status">连接中…</div><button id="leave" class="quiet">离开牌桌</button></header>
        <div class="table-wrap">
          <div class="table">
            <div class="felt-lines"></div><div class="table-mark">PRIVATE<br><b>HOLD'EM</b><small>10 / 20</small></div>
            <div id="pot" class="pot">底池 <b>0</b></div>
            <div id="board" class="board"></div>
            <div id="seat-0" class="seat top"></div><div id="seat-1" class="seat upper-right"></div><div id="seat-2" class="seat lower-right"></div>
            <div id="seat-3" class="seat bottom"></div><div id="seat-4" class="seat lower-left"></div><div id="seat-5" class="seat upper-left"></div>
          </div>
        </div>
        <aside id="side-panel"><div class="hand-state"><span id="phase">等待下一手</span><p id="message">入座后点击准备；所有玩家准备后自动开始。</p></div><div id="winner" class="winner hidden"></div><div id="controls"></div><div class="watchers">◉ <span id="watchers">0</span> 人正在观战</div></aside>
        <section id="leaderboard" class="leaderboard"><p>筹码累计榜</p><ol id="leaderboard-list"></ol></section>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
  </body>
</html>
